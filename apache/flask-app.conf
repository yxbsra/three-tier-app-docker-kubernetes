# Think of this file as giving Apache a set of forwarding rules.
# When a request comes in, Apache checks the path and decides where to send it.
# "app" is just the name we gave the Flask container in docker-compose.yml.
# Docker automatically handles the networking so Apache can reach it by name,
# the same way your browser finds a website by domain name instead of an IP address.

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    ProxyPreserveHost On

    # Forward /health to Flask
    ProxyPass        /health http://app:5000/health
    ProxyPassReverse /health http://app:5000/health

    # Forward /api/ to Flask
    ProxyPass        /api/ http://app:5000/api/
    ProxyPassReverse /api/ http://app:5000/api/

    # Security headers (added after OWASP ZAP baseline findings)
    # Block MIME-type sniffing
    Header always set X-Content-Type-Options "nosniff"
    # Block clickjacking (legacy header + CSP frame-ancestors below)
    Header always set X-Frame-Options "DENY"
    # Only allow resources from this site. 'unsafe-inline' is needed because
    # index.html uses an inline <script> and <style> block (planned: move to files).
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    # Turn off browser features the app doesn't use
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    # Isolate the page from other origins
    Header always set Cross-Origin-Embedder-Policy "require-corp"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    # Strip the backend's Server header (Flask/Werkzeug and Python versions)
    # from proxied responses; Apache's own header is reduced by ServerTokens Prod
    Header unset Server
    Header always unset Server
    # Don't let browsers or proxies cache responses (ticket data changes often)
    Header always set Cache-Control "no-store"

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
